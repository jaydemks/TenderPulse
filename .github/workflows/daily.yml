name: Daily sync and deploy

on:
  schedule:
    - cron: "17 5 * * *"   # every day at 05:17 UTC
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "config.json"
      - ".github/workflows/daily.yml"
  workflow_dispatch:
    inputs:
      window_days:
        description: "How many days of notices to pull from TED"
        default: "30"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Pull new notices from TED
        env:
          WINDOW_DAYS: ${{ github.event.inputs.window_days || '30' }}
        run: python scripts/sync.py

      - name: Commit the updated store
        run: |
          git config user.name  "tenderpulse-ci"
          git config user.email "actions@github.com"
          git add -A data/
          if ! git diff --staged --quiet; then
            git commit -m "data: TED sync $(date -u +%F)"
            git pull --rebase --autostash origin main
            git push
          fi

      - name: Resolve the canonical site URL
        run: |
          url="${{ vars.SITE_URL }}"
          if [ -z "$url" ]; then
            owner=$(echo "${GITHUB_REPOSITORY%%/*}" | tr '[:upper:]' '[:lower:]')
            url="https://${owner}.github.io/${GITHUB_REPOSITORY#*/}"
          fi
          echo "SITE_URL=$url" >> "$GITHUB_ENV"
          echo "Canonical URL: $url"

      - name: Build the site
        run: cd scripts && python build.py

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Keep the IndexNow request for after the deploy
        uses: actions/upload-artifact@v4
        with:
          name: indexnow
          path: indexnow.json
          if-no-files-found: ignore
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  notify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - id: get
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: indexnow

      - name: Tell IndexNow about the new notices
        if: steps.get.outcome == 'success'
        run: |
          set -eu
          n=$(jq '.urlList | length' indexnow.json)
          echo "submitting $n URLs"
          code=$(curl -sS -o response.txt -w '%{http_code}' -X POST             -H 'Content-Type: application/json; charset=utf-8'             --data-binary @indexnow.json             https://api.indexnow.org/indexnow)
          echo "IndexNow replied $code"
          cat response.txt || true
          case "$code" in
            200|202) ;;
            *) echo "::warning::IndexNow returned $code" ;;
          esac
