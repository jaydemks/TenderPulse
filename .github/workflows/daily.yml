name: Daily sync and deploy

on:
  schedule:
    - cron: "17 5 * * *"   # every day at 05:17 UTC
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "config.json"
      - ".github/workflows/daily.yml"
  workflow_dispatch:
    inputs:
      window_days:
        description: "How many days of notices to pull from TED"
        default: "30"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Pull new notices from TED
        env:
          WINDOW_DAYS: ${{ github.event.inputs.window_days || '30' }}
        run: python scripts/sync.py

      - name: Commit the updated store
        run: |
          git config user.name  "tenderpulse-ci"
          git config user.email "actions@github.com"
          git add -A data/
          if ! git diff --staged --quiet; then
            git commit -m "data: TED sync $(date -u +%F)"
            git pull --rebase --autostash origin main
            git push
          fi

      - name: Resolve the canonical site URL
        run: |
          url="${{ vars.SITE_URL }}"
          if [ -z "$url" ]; then
            owner=$(echo "${GITHUB_REPOSITORY%%/*}" | tr '[:upper:]' '[:lower:]')
            url="https://${owner}.github.io/${GITHUB_REPOSITORY#*/}"
          fi
          echo "SITE_URL=$url" >> "$GITHUB_ENV"
          echo "Canonical URL: $url"

      - name: Build the site
        run: cd scripts && python build.py

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
